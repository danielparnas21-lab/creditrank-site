<style>
@font-face{font-family:"Geist";src:url(geist.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--blue:#2458FF;--blue-2:#1746F5;--cyan:#36C9F0;--ink:#0B2246;--lime:#C7FF3C;--mute:rgba(11,34,70,.62)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#F7FAFF;color:var(--ink);font:400 17px/1.5 "Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.field{position:fixed;inset:-14vh 0;z-index:0;pointer-events:none;overflow:hidden}
.wave{position:absolute;border-radius:50%;filter:blur(44px);will-change:transform;animation:drift var(--d,36s) ease-in-out var(--o,0s) infinite alternate;transform:translate(-50%,-50%) rotate(var(--r,0deg))}
.w1{left:44%;top:34%;width:150%;height:24%;--r:-7deg;--d:32s;--o:-9s;background:linear-gradient(90deg,rgba(36,88,255,0),rgba(36,88,255,.16) 28%,rgba(54,201,240,.22) 58%,rgba(125,249,255,0))}
.w2{left:58%;top:58%;width:140%;height:18%;--r:5deg;--d:38s;--o:-20s;background:linear-gradient(90deg,rgba(125,249,255,0),rgba(54,201,240,.18) 35%,rgba(36,88,255,.14) 70%,rgba(36,88,255,0))}
.w3{left:78%;top:74%;width:58%;height:34%;--r:-10deg;--d:42s;--o:-11s;background:radial-gradient(50% 50% at 50% 50%,rgba(199,255,60,.26),rgba(199,255,60,.06) 45%,rgba(199,255,60,0) 72%)}
@keyframes drift{0%{transform:translate(-50%,-50%) rotate(var(--r)) translate(-5%,-7%) scale(1)}100%{transform:translate(-50%,-50%) rotate(var(--r)) translate(5%,7%) scale(1.07)}}
main{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px 48px}
.mark{position:relative;width:min(44vw,180px);aspect-ratio:1;display:grid;place-items:center;margin-bottom:clamp(22px,4vh,36px)}
.mark .bloom{position:absolute;inset:-60%;border-radius:50%;background:radial-gradient(50% 50% at 50% 50%,rgba(36,88,255,.34) 0%,rgba(54,201,240,.18) 36%,rgba(199,255,60,.12) 54%,rgba(36,88,255,0) 72%);filter:blur(22px);animation:breathe 5.6s ease-in-out infinite}
.mark .ring{position:absolute;inset:-14%;border-radius:50%;border:1.5px solid rgba(36,88,255,.35);opacity:0;animation:ripple 4.2s ease-out infinite}
.mark .ring.b{animation-delay:1.4s}
.mark svg{position:relative;width:100%;height:100%;overflow:visible;color:var(--blue);filter:drop-shadow(0 0 18px rgba(36,88,255,.55)) drop-shadow(0 10px 30px rgba(36,88,255,.35));animation:glow 5.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.75}50%{transform:scale(1.06);opacity:1}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 14px rgba(36,88,255,.45)) drop-shadow(0 10px 30px rgba(36,88,255,.3))}50%{filter:drop-shadow(0 0 30px rgba(54,201,240,.8)) drop-shadow(0 14px 40px rgba(36,88,255,.45))}}
@keyframes ripple{0%{transform:scale(.8);opacity:0}12%{opacity:.8}100%{transform:scale(1.9);opacity:0}}
.word{width:min(70vw,320px);color:var(--ink);margin-bottom:clamp(20px,3.6vh,30px)}
.word svg{width:100%;height:auto;display:block;overflow:visible}
h1{margin:0 0 10px;font:700 clamp(30px,6vw,52px)/1.05 "Geist",system-ui,sans-serif;letter-spacing:-.04em;background:linear-gradient(180deg,var(--ink),#152F6C);-webkit-background-clip:text;background-clip:text;color:transparent;padding:.1em .05em;margin:-.1em -.05em 10px}
h1 em{font-style:normal;background:linear-gradient(180deg,#2E63FF,var(--blue-2) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;max-width:34ch;font-size:clamp(15px,1.4vw,18px);color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:9px;margin-top:clamp(18px,3vh,26px);height:36px;padding:0 16px 0 13px;border-radius:999px;font:700 11.5px/1 "Geist",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-2);
  background:linear-gradient(180deg,#fff,#F2F6FE);border:1px solid rgba(11,34,70,.14);box-shadow:inset 0 1px 0 #fff,inset 0 -1.5px 0 rgba(11,34,70,.07),0 3px 0 -1px #DCE5F6,0 14px 28px -14px rgba(11,34,70,.4)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px rgba(199,255,60,.3),0 0 12px rgba(199,255,60,.9);animation:dot 2.6s ease-in-out infinite}
@keyframes dot{0%,100%{transform:scale(1)}50%{transform:scale(.72);opacity:.75}}
footer{position:fixed;left:0;right:0;bottom:0;z-index:1;padding:14px 20px calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:rgba(11,34,70,.5)}
@media (prefers-reduced-motion:reduce){.wave,.mark .bloom,.mark .ring,.mark svg,.pill i{animation:none}}
</style>
</head>
